name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build release APK
        run: ./gradlew assembleRelease
      
      - name: Rename APKs
        run: |
          mkdir -p release-artifacts
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            name=$(basename "$apk")
            if [[ "$name" == *"-unsigned"* ]]; then
              newname=$(echo "$name" | sed 's/-unsigned//')
              cp "$apk" "release-artifacts/AungMyoKyawEditor-${newname}"
            else
              cp "$apk" "release-artifacts/AungMyoKyawEditor-${name#app-}"
            fi
          done
          # Also include debug APKs as fallback
          for apk in app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue
            cp "$apk" "release-artifacts/"
          done
          ls -lh release-artifacts/
      
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
